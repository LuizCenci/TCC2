# Coleta Bronze definitiva — TJPR, G1, 2019–2026.
# Parâmetros documentados em docs/artigo/01-parametros-da-extracao.md.
# 2026 é coletado mas excluído da análise por decisão do autor (ano incompleto).
endpoint: "https://api-publica.datajud.cnj.jus.br/api_publica_tjpr/_search"
tribunal: "TJPR"
grau: "G1"
years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
# 1000 registros/página: a API tem latência fixa de ~22-33 s por consulta,
# então páginas maiores rendem ~2,3x mais (docs/artigo/03-desempenho-api-coleta.md).
page_size: 1000
# Limite de segurança: o maior ano tem ~25 mil registros (~25 páginas).
max_pages_per_partition: 100
connect_timeout_seconds: 10
# O servidor levou até 56 s para responder uma página de 1000 registros.
read_timeout_seconds: 180
max_attempts: 3
max_wait_seconds: 30
output_root: "work"
continue_on_partition_error: false
