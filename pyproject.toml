[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datajud-tcc"
version = "0.1.0"
description = "Coleta Bronze reproduzível de metadados do Datajud/TJPR"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "responses>=0.25,<1",
]

[project.scripts]
datajud-tcc = "datajud_tcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: teste que acessa a API real (opt-in)",
]
