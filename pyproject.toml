[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datajud-tcc"
version = "0.1.0"
description = "Coleta Bronze reproduzível de metadados do Datajud/TJPR"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "responses>=0.25,<1",
]
# Orquestração da base operacional (docs/artigo/15-orquestracao-prefect.md).
orquestracao = [
  "prefect>=3.9,<4",
]

# Métodos e agregados (docs/artigo/20).
analise = [
  "pandas>=2.2,<3",
  "lifelines>=0.29,<1",
]

# Silver em PostgreSQL local (carga a partir da Bronze).
banco = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
datajud-tcc = "datajud_tcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: teste que acessa a API real (opt-in)",
  "banco: teste que usa o PostgreSQL local (pulado sem DATABASE_URL/psycopg)",
  "gold_lento: roda as transformacoes da Gold sobre a Silver real (use -m \"not gold_lento\" para o ciclo rapido)",
]

[tool.setuptools.package-data]
"datajud_tcc.silver" = ["*.sql"]
"datajud_tcc.gold" = ["*.sql", "sql/*.sql"]
